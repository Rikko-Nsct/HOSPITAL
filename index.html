<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Mater Dei Betim-Contagem - Gestão de Pacientes</title>
    <style>
        :root {
            --primary: #1B365D;
            --primary-dark: #12243F;
            --accent: #D9E1F2;
            --success: #0F5132;
            --success-bg: #D1E7DD;
            --danger: #842029;
            --danger-bg: #F8D7DA;
            --bg-color: #F8F9FA;
            --card-bg: #FFFFFF;
            --text-main: #212529;
            --text-muted: #6C757D;
            --border-color: #DEE2E6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            line-height: 1.5;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #FFFFFF;
            padding: 24px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .badge-unit {
            background: rgba(255,255,255,0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            margin: 24px 32px 16px 32px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .search-container {
            padding: 0 32px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: all 0.2s;
            background-color: #FFFFFF;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(27, 54, 93, 0.1);
        }

        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
            opacity: 0.6;
        }

        .table-container {
            padding: 0 32px;
            overflow-x: auto;
            margin-bottom: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
            background: #FFFFFF;
        }

        th {
            background-color: var(--primary);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            padding: 14px 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
            vertical-align: middle;
        }

        tr:hover {
            background-color: #F8F9FA;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            text-align: center;
        }

        .status-badge.liberado {
            background-color: var(--success-bg);
            color: var(--success);
            border: 1px solid #A3CFBB;
        }

        .status-badge.pendente {
            background-color: var(--danger-bg);
            color: var(--danger);
            border: 1px solid #F1AEB5;
        }

        .actions-bar {
            padding: 20px 32px;
            background: #FFFFFF;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }

        .btn {
            background-color: var(--primary);
            color: #FFFFFF;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            background-color: var(--primary-dark);
        }

        .btn-secondary {
            background-color: #6C757D;
        }

        .btn-secondary:hover {
            background-color: #5C636A;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
            padding: 6px 12px;
            font-size: 0.8rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #bd2130;
        }

        .empty-message {
            text-align: center;
            padding: 24px;
            color: var(--text-muted);
            font-style: italic;
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header { padding: 16px 20px; }
            .section-title, .search-container, .table-container, .actions-bar {
                padding-left: 16px;
                padding-right: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <h1>Hospital Mater Dei</h1>
            <p>Painel de Controle e Acompanhamento de Pacientes</p>
        </div>
        <div class="badge-unit">Betim-Contagem</div>
    </div>

    <div class="section-title">🔍 Localizar Paciente</div>
    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Digite o nome do paciente para buscar..." onkeyup="filtrarPacientes()">
        </div>
    </div>

    <div class="section-title">👥 Relação de Pacientes Cadastrados</div>
    <div class="table-container">
        <table id="pacientesTable">
            <thead>
                <tr>
                    <th>Nome do Paciente</th>
                    <th style="width: 220px; text-align: center;">Planilha de Faturamento</th>
                    <th style="width: 180px; text-align: center;">Status de Liberação</th>
                    <th style="width: 140px; text-align: center;">Hora de Criação</th>
                    <th style="width: 90px; text-align: center;">Ação</th>
                </tr>
            </thead>
            <tbody id="pacientesTableBody"></tbody>
        </table>
    </div>

    <div class="actions-bar">
        <button class="btn" onclick="adicionarNovoPaciente()">+ Novo Paciente</button>
        <span style="font-size: 0.855rem; color: var(--text-muted);">Hospital Mater Dei Betim-Contagem • Sistema de Faturamento v2.0</span>
    </div>
</div>

<script>
    const pacientesPadrao = [
        { id: 1, nome: "Luanna Silva Santos", status: "liberado", hora: "08:30" },
        { id: 2, nome: "Carlos Eduardo Moreira", status: "pendente", hora: "09:15" },
        { id: 3, nome: "Mariana Souza Lima", status: "liberado", hora: "10:45" }
    ];

    function obterPacientes() {
        const armazenados = localStorage.getItem('lista_pacientes_materdei');
        if (armazenados) {
            return JSON.parse(armazenados);
        }
        localStorage.setItem('lista_pacientes_materdei', JSON.stringify(pacientesPadrao));
        return pacientesPadrao;
    }

    function salvarPacientes(lista) {
        localStorage.setItem('lista_pacientes_materdei', JSON.stringify(lista));
    }

    function renderizarTabela(filtro = "") {
        const tbody = document.getElementById('pacientesTableBody');
        tbody.innerHTML = "";
        const lista = obterPacientes();

        const listaFiltrada = lista.filter(p => p.nome.toLowerCase().includes(filtro.toLowerCase()));

        if (listaFiltrada.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="empty-message">Nenhum paciente encontrado.</td></tr>`;
            return;
        }

        listaFiltrada.forEach(paciente => {
            const tr = document.createElement('tr');

            const isLiberado = paciente.status.toLowerCase() === 'liberado';
            const statusClass = isLiberado ? 'liberado' : 'pendente';
            const statusText = isLiberado ? 'LIBERADO' : 'PENDENTE';

            tr.innerHTML = `
                <td><strong>${paciente.nome}</strong></td>
                <td style="text-align: center;">
                    <a href="index1.html?id=${paciente.id}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.8rem;">
                        📄 Abrir Planilha
                    </a>
                </td>
                <td style="text-align: center;">
                    <span class="status-badge ${statusClass}">${statusText}</span>
                </td>
                <td style="text-align: center; font-weight: 600;">${paciente.hora}</td>
                <td style="text-align: center;">
                    <button class="btn-danger" onclick="confirmarDelecao(${paciente.id}, '${paciente.nome}')">✕ Deletar</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function adicionarNovoPaciente() {
        const nome = prompt("Digite o nome completo do novo paciente:");
        if (nome === null || nome.trim() === "") {
            return;
        }

        const agora = new Date();
        const horas = String(agora.getHours()).padStart(2, '0');
        const minutos = String(agora.getMinutes()).padStart(2, '0');
        const horaAtual = `${horas}:${minutos}`;

        const lista = obterPacientes();
        const novoPaciente = {
            id: Date.now(),
            nome: nome.trim(),
            status: "pendente",
            hora: horaAtual
        };

        lista.push(novoPaciente);
        salvarPacientes(lista);
        renderizarTabela();
    }

    function confirmarDelecao(id, nome) {
        const certeza = confirm(`Tem certeza que deseja deletar o paciente "${nome}"?`);
        if (certeza) {
            let lista = obterPacientes();
            lista = lista.filter(p => p.id !== id);
            salvarPacientes(lista);
            renderizarTabela(document.getElementById('searchInput').value);
        }
    }

    function filtrarPacientes() {
        const termo = document.getElementById('searchInput').value;
        renderizarTabela(termo);
    }

    window.onload = function() {
        renderizarTabela();
    };
</script>

</body>
</html>
